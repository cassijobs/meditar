<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frase do Dia</title>
    <style>
        /* Estilos para a página inteira */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Estilo do container centralizado */
        .container {
            background: linear-gradient(135deg, #f3f4f7, #d0e4f2);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            overflow: hidden;
        }

        /* Estilo para o título */
        h1 {
            font-size: 2.5rem;
            color: #4e73df;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Estilo para a data */
        #data {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Estilo para a frase */
        #frase-do-dia {
            font-size: 1.5rem;
            color: #333;
            font-weight: 500;
            line-height: 1.6;
            text-align: center;
            margin: 20px 0;
        }

        /* Estilo para o botão */
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4e73df;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #375ac8;
        }

        /* Responsividade */
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            #frase-do-dia {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Frase do Dia</h1>
        <p id="data"></p>
        <p><strong id="frase-do-dia"></strong></p>
        <button onclick="fecharPagina()">Fechar</button>
    </div>
<script>

    // ==========================
    // PROTEÇÕES BÁSICAS
    // ==========================

    // Bloqueia clique direito
    document.addEventListener("contextmenu", function(e){
        e.preventDefault();
    });

    // Bloqueia copiar
    document.addEventListener("copy", function(e){
        e.preventDefault();
    });

    // Bloqueia recortar
    document.addEventListener("cut", function(e){
        e.preventDefault();
    });

    // Bloqueia arrastar
    document.addEventListener("dragstart", function(e){
        e.preventDefault();
    });

    // Bloqueia atalhos comuns
    document.addEventListener("keydown", function(e){

        if (e.key === "F12") {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && e.shiftKey &&
            ["I","J","C","K"].includes(e.key.toUpperCase())) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey &&
            ["U","S","P"].includes(e.key.toUpperCase())) {
            e.preventDefault();
            return false;
        }

        return true;
    });

    // Detecta DevTools (não é infalível)
    let devtools = false;

    setInterval(function () {

        const widthThreshold =
            window.outerWidth - window.innerWidth > 160;

        const heightThreshold =
            window.outerHeight - window.innerHeight > 160;

        if (widthThreshold || heightThreshold) {

            if (!devtools) {

                devtools = true;

                document.body.innerHTML = `
                    <div style="
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        height:100vh;
                        font-family:Arial;
                        font-size:24px;
                        text-align:center;
                        padding:20px;
                    ">
                        Conteúdo protegido.
                    </div>
                `;
            }
        }
    }, 1000);

    // ==========================
    // FRASES DO DIA
    // ==========================

    const frases = [
        "Eu sou capaz de alcançar tudo o que eu quero.",
        "Eu sou grato pelas pequenas coisas da vida."
    ];

    function obterDiaDoAno() {
        const hoje = new Date();
        const inicioDoAno = new Date(hoje.getFullYear(), 0, 0);
        const diff = hoje - inicioDoAno;
        const umDia = 1000 * 60 * 60 * 24;
        return Math.floor(diff / umDia);
    }

    function atualizarFraseDoDia() {

        const diaDoAno = obterDiaDoAno();

        const frase =
            frases[diaDoAno - 1] ||
            "Frase não definida para este dia.";

        const hoje = new Date();

        document.getElementById("data").textContent =
            `Hoje é ${hoje.toLocaleDateString()}.`;

        document.getElementById("frase-do-dia").textContent =
            frase;
    }

    atualizarFraseDoDia();

    function fecharPagina() {
        window.location.replace("about:blank");

        setTimeout(() => {
            window.close();
        }, 100);
    }

</script>
</body>
</html>
